name: Android app

# android 폴더가 바뀌면 안드로이드 앱(APK)을 새로 만들어
# Releases의 "android-app"에 english-talk.apk 로 올립니다.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk english-talk.apk
          gh release delete android-app -y --cleanup-tag || true
          gh release create android-app english-talk.apk \
            --title "English Talk 안드로이드 앱" \
            --notes "휴대폰에서 english-talk.apk 를 눌러 받아 설치하세요." \
            --latest
