<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>English Talk</title>
<style>
  :root {
    --bg: #fff8ef; --card: #ffffff; --text: #2b2b2b; --muted: #8a8a8a;
    --lucy: #ff8fb1; --lucy-soft: #ffe3ec; --leo: #ffb347; --leo-soft: #fff0d9;
    --me: #dff3ff; --ai: #ffffff; --line: #eee3d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* Home */
  #home { align-items: center; justify-content: center; padding: 24px 16px; gap: 20px; position: relative; }
  #home h1 { margin: 0 0 8px; font-size: 30px; }
  .kid-btn { width: 100%; max-width: 340px; border: none; border-radius: 28px; padding: 22px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 700; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.12); cursor: pointer; }
  .kid-btn .pic { font-size: 64px; background: rgba(255,255,255,.35); border-radius: 50%; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; }
  .kid-btn.lucy { background: var(--lucy); }
  .kid-btn.leo { background: var(--leo); }
  .kid-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  #settingsBtn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 26px; opacity: .6; }

  /* Topics */
  #topics { overflow-y: auto; }
  .topicHead { text-align: center; padding: 6px 16px 0; }
  .topicHead h2 { margin: 6px 0 2px; font-size: 24px; }
  .topicHead p { margin: 0; color: var(--muted); font-size: 15px; }
  #topicGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .topic { border: none; border-radius: 20px; padding: 16px 10px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.08); font-size: 17px; font-weight: 700; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .topic .ic { font-size: 38px; }
  .topic.used { opacity: .35; filter: grayscale(1); }
  .topic.used::after { content: "✔ Done"; font-size: 13px; font-weight: 600; }
  .topic.random { grid-column: 1 / -1; color: #fff; font-size: 20px; }
  .progress { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 20px; }

  /* Chat */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .topbar .back { border: none; background: none; font-size: 24px; }
  .topbar .who { font-size: 20px; font-weight: 700; flex: 1; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 14px; background: var(--leo-soft); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 12px 14px; border-radius: 18px; font-size: 19px; line-height: 1.4; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 6px; }
  .msg.note { align-self: center; background: none; color: var(--muted); font-size: 15px; }
  .bottom { padding: 12px 16px 20px; background: var(--card); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #micBtn { width: 96px; height: 96px; border-radius: 50%; border: none; font-size: 44px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  #micBtn.listening { animation: pulse 1s infinite; }
  #micBtn:disabled { opacity: .45; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #status { font-size: 15px; color: var(--muted); min-height: 20px; text-align: center; }
  .typeRow { display: flex; gap: 8px; width: 100%; }
  .typeRow input { flex: 1; font-size: 17px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); }
  .typeRow button { font-size: 17px; padding: 10px 14px; border-radius: 14px; border: none; background: #ddd; }

  /* Settings */
  #settings { padding: 20px 16px; gap: 14px; overflow-y: auto; }
  #settings label { font-weight: 700; display: block; margin-bottom: 6px; }
  #settings input { width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  #settings .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; font-size: 17px; padding: 14px; border-radius: 14px; border: none; background: #333; color: #fff; }
  .btn.light { background: #ddd; color: #333; }
</style>
</head>
<body>

<!-- 첫 화면 -->
<section id="home" class="screen active">
  <button id="settingsBtn" aria-label="Settings">⚙️</button>
  <h1>Let's Talk! 🗣️</h1>
  <button class="kid-btn lucy" data-kid="lucy"><span class="pic">🐷</span>Lucy</button>
  <button class="kid-btn leo" data-kid="leo"><span class="pic">🐱</span>Leo</button>
</section>

<!-- 주제 고르기 화면 -->
<section id="topics" class="screen">
  <div class="topbar">
    <button class="back" id="topicBackBtn">←</button>
    <div class="who" id="topicWho"></div>
  </div>
  <div class="topicHead">
    <h2>What do you want to talk about?</h2>
    <p id="topicSub"></p>
  </div>
  <div id="topicGrid"></div>
  <div class="progress" id="topicProgress"></div>
</section>

<!-- 대화 화면 -->
<section id="chat" class="screen">
  <div class="topbar">
    <button class="back" id="backBtn">←</button>
    <div class="who" id="whoLabel"></div>
    <div class="timer" id="timer">5:00</div>
  </div>
  <div id="messages"></div>
  <div class="bottom">
    <button id="micBtn">🎤</button>
    <div id="status">Tap the mic and talk!</div>
    <div class="typeRow">
      <input id="typeInput" placeholder="Or type here..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</section>

<!-- 설정 화면 (부모님용) -->
<section id="settings" class="screen">
  <h2 style="margin:0">설정</h2>
  <div>
    <label for="apiKey">Gemini API 키</label>
    <input id="apiKey" type="password" placeholder="AI Studio에서 만든 키">
    <div class="hint">키는 이 휴대폰 브라우저에만 저장되고, 코드에는 들어가지 않습니다.</div>
  </div>
  <div>
    <label for="model">모델 이름</label>
    <input id="model" placeholder="예: gemini-3.5-flash-lite">
    <div class="hint">AI Studio에서 무료로 표시되는 Flash-Lite 계열 모델 이름을 그대로 복사해 넣으세요.</div>
  </div>
  <div class="row">
    <button class="btn light" id="cancelSettings">닫기</button>
    <button class="btn" id="saveSettings">저장</button>
  </div>
</section>

<script>
// ---------- 아이별 설정 ----------
const KIDS = {
  lucy: {
    name: "Lucy", emoji: "🐷", color: "var(--lucy)", soft: "var(--lucy-soft)",
    minutes: 10, rate: 1.0,
    prompt: `You are a friendly English conversation buddy for Lucy, a 5th-grade girl in Korea (about 11 years old) who is learning English.
Talk like a fun, kind friend a little older than her.
- Use simple but natural English. Replies of 2-3 short sentences.
- Ask only one question at a time, and keep the conversation going.
- She can try longer sentences, so gently encourage her to say a bit more.`,
    topics: [
      { id: "kalimba", icon: "🎶", title: "Kalimba & Music", hint: "Talk about playing the kalimba, favorite songs, practicing, and music she likes." },
      { id: "friends", icon: "👭", title: "Friends", hint: "Talk about friends, playing together, being kind, and fun things with friends. Keep it about friendship only." },
      { id: "school", icon: "🏫", title: "My School Day", hint: "Talk about classes, favorite subjects, lunch, and what happened at school." },
      { id: "food", icon: "🍜", title: "Favorite Food", hint: "Talk about favorite foods, snacks, Korean food, and what she likes to eat." },
      { id: "animals", icon: "🐶", title: "Animals & Pets", hint: "Talk about animals, pets, cute animals, and how to take care of pets." },
      { id: "drawing", icon: "🎨", title: "Drawing & Crafts", hint: "Talk about drawing, colors, making things, and her art." },
      { id: "science", icon: "🔬", title: "Science Fun", hint: "Talk about fun science facts and easy experiments from 5th-grade science class." },
      { id: "travel", icon: "✈️", title: "Travel", hint: "Talk about trips, places she has been, and places she wants to visit." },
      { id: "dreams", icon: "🌟", title: "Dreams for the Future", hint: "Talk about what she wants to be or do when she grows up." }
    ]
  },
  leo: {
    name: "Leo", emoji: "🐱", color: "var(--leo)", soft: "var(--leo-soft)",
    minutes: 5, rate: 0.85,
    prompt: `You are a warm, kind English conversation partner for Leo, a 3rd-grade boy in Korea (about 9 years old) who is learning English.
Talk like a gentle, cheerful teacher.
- Use very easy words and very short sentences. Replies of 1-2 short sentences.
- Ask only one simple question at a time. Yes/no or choice questions are good.
- Praise his effort often ("Great job!", "Nice!").`,
    topics: [
      { id: "soccer", icon: "⚽", title: "Soccer", hint: "Talk about playing soccer, favorite positions, scoring goals, and soccer players." },
      { id: "games", icon: "🎮", title: "Video Games", hint: "Talk about games he likes, characters, and what is fun about them. Keep it about kid-friendly games." },
      { id: "memes", icon: "😂", title: "Funny Songs & Memes", hint: "Talk about funny kid memes and songs popular with Korean elementary kids, like 'Take the L', Italian Brainrot characters, and '6 7'. Be playful and silly, keep it kind and kid-friendly." },
      { id: "family", icon: "👨‍👩‍👧‍👦", title: "My Family", hint: "Talk about family members and fun things the family does together." },
      { id: "animals", icon: "🦁", title: "Animals", hint: "Talk about favorite animals, zoo animals, and what animals can do." },
      { id: "cats", icon: "🐈", title: "Cats", hint: "Talk about cats, what cats like, and funny things cats do." },
      { id: "food", icon: "🍕", title: "Favorite Food", hint: "Talk about favorite foods and snacks." },
      { id: "weather", icon: "⛅", title: "Weather", hint: "Talk about today's weather, seasons, rain, snow, and what to wear." }
    ]
  }
};
const RANDOM_HINT = "There is no fixed topic. First ask if they have something they want to talk about today. If they say yes, talk about that (if it is suitable for a young child). If they don't know, suggest one fun surprise topic yourself.";

const COMMON_RULES = `
Rules for every reply:
- Speak only in English. If the child speaks Korean, help with one easy English phrase they can say, then continue in English.
- Error correction: do NOT point out mistakes directly. Only for serious or repeated mistakes, naturally repeat the correct form inside your reply.
  Example: child says "I goed to park" -> you say "Oh, you went to the park? Fun!"
- Keep everything safe and appropriate for young children. If a topic is not suitable (romance, violence, scary or adult things), gently change to a fun, safe topic.
- Never ask for personal information like full name, school name, address, or phone number.
- No emojis, no lists, no markdown. Your reply will be read aloud.`;

// ---------- 저장소 (실패해도 동작하도록) ----------
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------- 상태 ----------
let kid = null, kidId = null, topic = null, history = [], timeLeft = 0, timerId = null, timeUp = false, busy = false, turns = 0;
const MIN_TURNS_TO_COUNT = 3; // 아이가 3번 이상 말해야 '한 주제'로 인정

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

// ---------- 화면 이동 ----------
document.querySelectorAll(".kid-btn").forEach(b => b.onclick = () => showTopics(b.dataset.kid));
$("backBtn").onclick = endChat;
$("topicBackBtn").onclick = () => show("home");

// ---------- 주제 (한 번 고른 주제는 잠금, 다 쓰면 초기화) ----------
function usedTopics(k) {
  try { return JSON.parse(store.get("used_" + k) || "[]"); } catch (e) { return []; }
}
function markTopicUsed() {
  if (!topic || topic.id === "random") return;
  const all = KIDS[kidId].topics.map(t => t.id);
  let used = usedTopics(kidId).filter(id => all.includes(id));
  if (!used.includes(topic.id)) used.push(topic.id);
  if (used.length >= all.length) used = []; // 다 골랐으면 다시 처음부터
  store.set("used_" + kidId, JSON.stringify(used));
}

function showTopics(k) {
  if (!store.get("geminiKey") || !store.get("geminiModel")) {
    alert("먼저 ⚙️ 설정에서 API 키와 모델 이름을 넣어 주세요.");
    return;
  }
  kidId = k; kid = KIDS[k];
  $("topicWho").textContent = kid.emoji + " " + kid.name;
  $("topicSub").textContent = "Pick one! Done topics come back after you finish them all.";
  const used = usedTopics(k);
  const grid = $("topicGrid"); grid.innerHTML = "";
  kid.topics.forEach(t => {
    const b = document.createElement("button");
    const isUsed = used.includes(t.id);
    b.className = "topic" + (isUsed ? " used" : "");
    b.disabled = isUsed;
    b.innerHTML = '<span class="ic">' + t.icon + "</span>" + t.title;
    b.onclick = () => startChat(t);
    grid.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "topic random"; r.style.background = kid.color;
  r.innerHTML = '<span class="ic">🎲</span>Random';
  r.onclick = () => startChat({ id: "random", icon: "🎲", title: "Random", hint: RANDOM_HINT });
  grid.appendChild(r);
  const done = used.filter(id => kid.topics.some(t => t.id === id)).length;
  $("topicProgress").textContent = done + " / " + kid.topics.length + " topics done";
  show("topics");
}
$("settingsBtn").onclick = () => { $("apiKey").value = store.get("geminiKey"); $("model").value = store.get("geminiModel"); show("settings"); };
$("cancelSettings").onclick = () => show("home");
$("saveSettings").onclick = () => {
  store.set("geminiKey", $("apiKey").value.trim());
  store.set("geminiModel", $("model").value.trim());
  show("home");
};

function startChat(t) {
  topic = t; history = []; timeUp = false; turns = 0;
  $("messages").innerHTML = "";
  $("whoLabel").textContent = kid.emoji + " " + kid.name + " · " + t.icon + " " + t.title;
  $("micBtn").style.background = kid.color;
  $("timer").style.background = kid.soft;
  timeLeft = kid.minutes * 60; drawTimer();
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--; drawTimer();
    if (timeLeft <= 0) { clearInterval(timerId); timeUp = true; wrapUp(); }
  }, 1000);
  setInputs(true);
  show("chat");
  // AI가 먼저 인사
  const opener = topic.id === "random"
    ? "(The conversation is starting. Greet " + kid.name + " warmly by name, then ask if there is something they want to talk about today.)"
    : "(The conversation is starting. Greet " + kid.name + " warmly by name, say today's topic is \"" + topic.title + "\", and ask one easy question about it.)";
  ask(opener, true);
}

function endChat() {
  clearInterval(timerId);
  stopListening();
  try { speechSynthesis.cancel(); } catch (e) {}
  if (timeUp || turns >= MIN_TURNS_TO_COUNT) markTopicUsed();
  showTopics(kidId);
}

function drawTimer() {
  const t = Math.max(0, timeLeft);
  $("timer").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

// ---------- 메시지 표시 ----------
function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function setStatus(t) { $("status").textContent = t; }
function setInputs(on) {
  $("micBtn").disabled = !on; $("sendBtn").disabled = !on; $("typeInput").disabled = !on;
}

// ---------- Gemini 호출 ----------
async function ask(text, hidden) {
  if (busy) return;
  busy = true; setInputs(false); setStatus("Thinking...");
  if (!hidden) { addMsg(text, "me"); turns++; }
  history.push({ role: "user", parts: [{ text }] });
  try {
    const model = store.get("geminiModel");
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent",
      {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": store.get("geminiKey") },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: kid.prompt + "\n\nToday's topic: " + topic.title + ". " + topic.hint + " Stay mostly on this topic, but it's okay to follow the child's interest if it is suitable." + COMMON_RULES }] },
          contents: history,
          generationConfig: { temperature: 0.8, maxOutputTokens: 200 }
        })
      }
    );
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
    const reply = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim()
      || "Sorry, can you say that again?";
    history.push({ role: "model", parts: [{ text: reply }] });
    addMsg(reply, "ai");
    await speak(reply);
  } catch (err) {
    history.pop();
    addMsg("⚠️ 연결 오류: " + err.message, "note");
  }
  busy = false;
  if (timeUp) { setInputs(false); markTopicUsed(); topic = { ...topic, id: "random" }; setStatus("Time's up! Great job today! 🎉 Tap ← to go back."); }
  else { setInputs(true); setStatus("Tap the mic and talk!"); }
}

function wrapUp() {
  stopListening();
  const go = () => busy ? setTimeout(go, 500) : ask("(Time is up. Say a short, happy goodbye to " + kid.name + ", praise their effort, and say let's talk again tomorrow. Do not ask a question.)", true);
  go();
}

// ---------- 읽어 주기 (TTS) ----------
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
loadVoices();
try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}

function pickVoice() {
  const en = voices.filter(v => /^en(-|_)/i.test(v.lang));
  const female = /(samantha|karen|moira|tessa|victoria|zira|female|woman|aria|jenny|google us english)/i;
  return en.find(v => female.test(v.name) && /US/i.test(v.lang)) || en.find(v => female.test(v.name)) || en.find(v => /US/i.test(v.lang)) || en[0] || null;
}

function speak(text) {
  return new Promise(resolve => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(); if (v) u.voice = v;
      u.lang = v ? v.lang : "en-US";
      u.rate = kid.rate; u.pitch = 1.1;
      u.onend = resolve; u.onerror = resolve;
      setStatus("🔊 Listening to " + kid.name + "'s buddy...");
      speechSynthesis.speak(u);
    } catch (e) { resolve(); }
  });
}

// ---------- 음성 인식 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

function stopListening() {
  if (rec && listening) { try { rec.stop(); } catch (e) {} }
  listening = false; $("micBtn").classList.remove("listening");
}

$("micBtn").onclick = () => {
  if (!SR) { alert("이 브라우저는 음성 인식을 지원하지 않습니다. 아이폰은 Safari, 안드로이드는 Chrome을 써 주세요. 아래 칸에 글자로 입력해도 됩니다."); return; }
  if (listening) { stopListening(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const said = e.results[0][0].transcript.trim();
    stopListening();
    if (said) ask(said);
  };
  rec.onerror = e => {
    stopListening();
    setStatus(e.error === "not-allowed" ? "마이크 권한을 허용해 주세요." : "I didn't hear you. Try again!");
  };
  rec.onend = () => { if (listening) stopListening(); };
  listening = true; $("micBtn").classList.add("listening"); setStatus("I'm listening... 👂");
  try { rec.start(); } catch (e) { stopListening(); }
};

// ---------- 글자 입력 ----------
function sendTyped() {
  const t = $("typeInput").value.trim();
  if (!t || busy || timeUp) return;
  $("typeInput").value = ""; ask(t);
}
$("sendBtn").onclick = sendTyped;
$("typeInput").addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });
</script>
</body>
</html>
