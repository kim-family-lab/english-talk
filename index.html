<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>English Talk</title>
<style>
  :root {
    --bg: #fff8ef; --card: #ffffff; --text: #2b2b2b; --muted: #8a8a8a;
    --lucy: #ff8fb1; --lucy-soft: #ffe3ec; --leo: #ffb347; --leo-soft: #fff0d9;
    --me: #dff3ff; --ai: #ffffff; --line: #eee3d6; --gold: #ffc531;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--text); }
  button { font-family: inherit; cursor: pointer; }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }

  /* Home */
  #home { align-items: center; justify-content: center; padding: 24px 16px; gap: 20px; position: relative; }
  #home h1 { margin: 0 0 8px; font-size: 30px; }
  .kid-btn { width: 100%; max-width: 340px; border: none; border-radius: 28px; padding: 22px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 700; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
  .kid-btn .pic { font-size: 64px; background: rgba(255,255,255,.35); border-radius: 50%; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .kid-btn .meta { display: flex; flex-direction: column; align-items: flex-start; }
  .kid-btn .meta small { font-size: 15px; font-weight: 600; opacity: .9; }
  .kid-btn.lucy { background: var(--lucy); }
  .kid-btn.leo { background: var(--leo); }
  .kid-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  #settingsBtn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 26px; opacity: .6; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .topbar .back { border: none; background: none; font-size: 24px; }
  .topbar .who { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-weight: 700; padding: 6px 12px; border-radius: 14px; background: var(--leo-soft); border: none; font-size: 15px; white-space: nowrap; }

  /* Topics */
  #topics { overflow-y: auto; }
  .topicHead { text-align: center; padding: 6px 16px 0; }
  .topicHead h2 { margin: 6px 0 2px; font-size: 24px; }
  .topicHead p { margin: 0; color: var(--muted); font-size: 15px; }
  #topicGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .topic { border: none; border-radius: 20px; padding: 16px 10px; background: var(--card); box-shadow: 0 4px 0 rgba(0,0,0,.08); font-size: 17px; font-weight: 700; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .topic .ic { font-size: 38px; }
  .topic.used { opacity: .35; filter: grayscale(1); }
  .topic.used::after { content: "✔ Done"; font-size: 13px; font-weight: 600; }
  .topic.random { grid-column: 1 / -1; color: #fff; font-size: 20px; }
  .progress { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 20px; }

  /* Chat */
  .timer { font-variant-numeric: tabular-nums; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 12px 14px; border-radius: 18px; font-size: 19px; line-height: 1.4; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 6px; }
  .msg.note { align-self: center; background: none; color: var(--muted); font-size: 15px; }
  .bottom { padding: 12px 16px 20px; background: var(--card); border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #micBtn { width: 96px; height: 96px; border-radius: 50%; border: none; font-size: 44px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  #micBtn.listening { animation: pulse 1s infinite; }
  #micBtn:disabled { opacity: .45; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #status { font-size: 15px; color: var(--muted); min-height: 20px; text-align: center; }
  .typeRow { display: flex; gap: 8px; width: 100%; }
  .typeRow input { flex: 1; min-width: 0; font-size: 17px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); }
  .typeRow button { font-size: 17px; padding: 10px 14px; border-radius: 14px; border: none; background: #ddd; }

  /* Result */
  #result { overflow-y: auto; align-items: center; padding: 24px 16px 32px; gap: 14px; text-align: center; }
  #result h2 { margin: 4px 0 0; font-size: 28px; }
  .bigEmoji { font-size: 76px; animation: pop .6s ease-out; }
  .stars { font-size: 48px; letter-spacing: 6px; }
  .stars span { display: inline-block; opacity: 0; transform: scale(.3); animation: starIn .45s ease-out forwards; }
  .stars span.off { filter: grayscale(1); }
  @keyframes starIn { to { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 20px; padding: 14px 16px; box-shadow: 0 4px 0 rgba(0,0,0,.06); text-align: left; }
  .card h3 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 4px 0; font-size: 17px; line-height: 1.4; }
  .card ul { margin: 0; padding-left: 20px; font-size: 18px; line-height: 1.6; }
  .badge { display: inline-block; background: var(--gold); color: #5a3d00; font-weight: 700; padding: 8px 14px; border-radius: 14px; font-size: 17px; }
  .levelUp { background: linear-gradient(135deg, #ffe08a, #ffb3c7); text-align: center; animation: pop .6s ease-out; }
  .levelUp h3 { font-size: 22px; }
  .btnRow { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .bigBtn { flex: 1; border: none; border-radius: 18px; padding: 16px; font-size: 18px; font-weight: 700; color: #fff; background: #333; }
  .bigBtn.light { background: #e8e1d8; color: #333; }

  /* Sticker board */
  #board { overflow-y: auto; }
  .boardTop { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 16px 16px 0; }
  .stat { background: var(--card); border-radius: 16px; padding: 10px 14px; text-align: center; min-width: 92px; box-shadow: 0 3px 0 rgba(0,0,0,.05); }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .goal { margin: 16px; background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .goal .bar { height: 16px; border-radius: 10px; background: #eee; overflow: hidden; margin: 8px 0 4px; }
  .goal .fill { height: 100%; border-radius: 10px; transition: width .6s; }
  .goal small { color: var(--muted); }
  #stickerGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 16px 28px; }
  .sticker { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--card); box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .sticker.empty { background: #f1ebe3; box-shadow: none; font-size: 14px; color: #c9bdb0; }
  .sticker.att { background: #e5f6ff; }

  /* Settings */
  #settings { padding: 20px 16px; gap: 14px; overflow-y: auto; }
  #settings label { font-weight: 700; display: block; margin-bottom: 6px; }
  #settings input[type=text], #settings input[type=password] { width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  #settings .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .checkRow { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .checkRow input { width: 22px; height: 22px; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; font-size: 17px; padding: 14px; border-radius: 14px; border: none; background: #333; color: #fff; }
  .btn.light { background: #ddd; color: #333; }
</style>
</head>
<body>

<!-- 첫 화면 -->
<section id="home" class="screen active">
  <button id="settingsBtn" aria-label="Settings">⚙️</button>
  <h1>Let's Talk! 🗣️</h1>
  <button class="kid-btn lucy" data-kid="lucy"><span class="pic">🐷</span><span class="meta">Lucy<small id="homeLucy"></small></span></button>
  <button class="kid-btn leo" data-kid="leo"><span class="pic">🐱</span><span class="meta">Leo<small id="homeLeo"></small></span></button>
</section>

<!-- 주제 고르기 화면 -->
<section id="topics" class="screen">
  <div class="topbar">
    <button class="back" id="topicBackBtn">←</button>
    <div class="who" id="topicWho"></div>
    <button class="pill" id="boardBtn">⭐ Stickers</button>
  </div>
  <div class="topicHead">
    <h2>What do you want to talk about?</h2>
    <p id="topicSub"></p>
  </div>
  <div id="topicGrid"></div>
  <div class="progress" id="topicProgress"></div>
</section>

<!-- 대화 화면 -->
<section id="chat" class="screen">
  <div class="topbar">
    <button class="back" id="backBtn">←</button>
    <div class="who" id="whoLabel"></div>
    <div class="pill timer" id="timer">5:00</div>
  </div>
  <div id="messages"></div>
  <div class="bottom">
    <button id="micBtn">🎤</button>
    <div id="status">Tap the mic and talk!</div>
    <div class="typeRow">
      <input id="typeInput" placeholder="Or type here..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</section>

<!-- 마무리 화면 -->
<section id="result" class="screen">
  <div class="bigEmoji" id="resEmoji">🐱</div>
  <h2 id="resTitle">Great job!</h2>
  <div class="stars" id="resStars"></div>
  <div id="resAttend"></div>
  <div class="card" id="resCheer"></div>
  <div class="card" id="resLevel" style="display:none"></div>
  <div class="card">
    <h3>✨ Today's expressions</h3>
    <ul id="resWords"><li>Loading...</li></ul>
  </div>
  <div class="btnRow">
    <button class="bigBtn light" id="resBoardBtn">⭐ Stickers</button>
    <button class="bigBtn" id="resDoneBtn">Done</button>
  </div>
</section>

<!-- 스티커판 -->
<section id="board" class="screen">
  <div class="topbar">
    <button class="back" id="boardBackBtn">←</button>
    <div class="who" id="boardWho"></div>
  </div>
  <div class="boardTop">
    <div class="stat"><b id="bTotal">0</b><span>stickers</span></div>
    <div class="stat"><b id="bStreak">0</b><span>day streak 🔥</span></div>
    <div class="stat"><b id="bDays">0</b><span>days talked</span></div>
  </div>
  <div class="goal">
    <b id="goalText"></b>
    <div class="bar"><div class="fill" id="goalFill"></div></div>
    <small id="goalSub"></small>
  </div>
  <div id="stickerGrid"></div>
</section>

<!-- 설정 화면 (부모님용) -->
<section id="settings" class="screen">
  <h2 style="margin:0">설정</h2>
  <div>
    <label for="apiKey">Gemini API 키</label>
    <input id="apiKey" type="password" placeholder="AI Studio에서 만든 키">
    <div class="hint">키는 이 휴대폰 브라우저에만 저장되고, 코드에는 들어가지 않습니다.</div>
  </div>
  <div>
    <label for="model">모델 이름</label>
    <input id="model" type="text" placeholder="예: gemini-3.5-flash-lite">
  </div>
  <div>
    <label>레벨업 상 (스티커 10·30·50개)</label>
    <input id="prize1" type="text" placeholder="10개: 예) 아이스크림 🍦" style="margin-bottom:8px">
    <input id="prize2" type="text" placeholder="30개: 예) 주말 게임 30분 🎮" style="margin-bottom:8px">
    <input id="prize3" type="text" placeholder="50개: 예) 원하는 선물 🎁">
    <div class="hint">50개 이후로는 30개마다 3번째 상이 다시 나옵니다.</div>
  </div>
  <label class="checkRow"><input id="testMode" type="checkbox"> 테스트 모드 (대화 1분)</label>
  <div class="row">
    <button class="btn light" id="cancelSettings">닫기</button>
    <button class="btn" id="saveSettings">저장</button>
  </div>
</section>

<script>
// ---------- 아이별 설정 ----------
const KIDS = {
  lucy: {
    name: "Lucy", emoji: "🐷", color: "var(--lucy)", soft: "var(--lucy-soft)",
    minutes: 10, rate: 1.0,
    // 처음 일주일 기본 기준 (이후엔 최근 평균으로 자동 조정)
    base: { turns: 10, words: 5, newWords: 5 },
    prompt: `You are a friendly English conversation buddy for Lucy, a 5th-grade girl in Korea (about 11 years old) who is learning English.
Talk like a fun, kind friend a little older than her.
- Use simple but natural English. Replies of 2-3 short sentences.
- Ask only one question at a time, and keep the conversation going.
- She can try longer sentences, so gently encourage her to say a bit more.`,
    topics: [
      { id: "kalimba", icon: "🎶", title: "Kalimba & Music", hint: "Talk about playing the kalimba, favorite songs, practicing, and music she likes." },
      { id: "friends", icon: "👭", title: "Friends", hint: "Talk about friends, playing together, being kind, and fun things with friends. Keep it about friendship only." },
      { id: "school", icon: "🏫", title: "My School Day", hint: "Talk about classes, favorite subjects, lunch, and what happened at school." },
      { id: "food", icon: "🍜", title: "Favorite Food", hint: "Talk about favorite foods, snacks, Korean food, and what she likes to eat." },
      { id: "animals", icon: "🐶", title: "Animals & Pets", hint: "Talk about animals, pets, cute animals, and how to take care of pets." },
      { id: "drawing", icon: "🎨", title: "Drawing & Crafts", hint: "Talk about drawing, colors, making things, and her art." },
      { id: "science", icon: "🔬", title: "Science Fun", hint: "Talk about fun science facts and easy experiments from 5th-grade science class." },
      { id: "travel", icon: "✈️", title: "Travel", hint: "Talk about trips, places she has been, and places she wants to visit." },
      { id: "dreams", icon: "🌟", title: "Dreams for the Future", hint: "Talk about what she wants to be or do when she grows up." }
    ]
  },
  leo: {
    name: "Leo", emoji: "🐱", color: "var(--leo)", soft: "var(--leo-soft)",
    minutes: 5, rate: 0.85,
    base: { turns: 6, words: 3, newWords: 3 },
    prompt: `You are a warm, kind English conversation partner for Leo, a 3rd-grade boy in Korea (about 9 years old) who is learning English.
Talk like a gentle, cheerful teacher.
- Use very easy words and very short sentences. Replies of 1-2 short sentences.
- Ask only one simple question at a time. Yes/no or choice questions are good.
- Praise his effort often ("Great job!", "Nice!").`,
    topics: [
      { id: "soccer", icon: "⚽", title: "Soccer", hint: "Talk about playing soccer, favorite positions, scoring goals, and soccer players." },
      { id: "games", icon: "🎮", title: "Video Games", hint: "Talk about games he likes, characters, and what is fun about them. Keep it about kid-friendly games." },
      { id: "memes", icon: "😂", title: "Funny Songs & Memes", hint: "Talk about funny kid memes and songs popular with Korean elementary kids, like 'Take the L', Italian Brainrot characters, and '6 7'. Be playful and silly, keep it kind and kid-friendly." },
      { id: "family", icon: "👨‍👩‍👧‍👦", title: "My Family", hint: "Talk about family members and fun things the family does together." },
      { id: "animals", icon: "🦁", title: "Animals", hint: "Talk about favorite animals, zoo animals, and what animals can do." },
      { id: "cats", icon: "🐈", title: "Cats", hint: "Talk about cats, what cats like, and funny things cats do." },
      { id: "food", icon: "🍕", title: "Favorite Food", hint: "Talk about favorite foods and snacks." },
      { id: "weather", icon: "⛅", title: "Weather", hint: "Talk about today's weather, seasons, rain, snow, and what to wear." }
    ]
  }
};
const RANDOM_HINT = "There is no fixed topic. First ask if they have something they want to talk about today. If they say yes, talk about that (if it is suitable for a young child). If they don't know, suggest one fun surprise topic yourself.";

const COMMON_RULES = `
Rules for every reply:
- Speak only in English. If the child speaks Korean, help with one easy English phrase they can say, then continue in English.
- Error correction: do NOT point out mistakes directly. Only for serious or repeated mistakes, naturally repeat the correct form inside your reply.
  Example: child says "I goed to park" -> you say "Oh, you went to the park? Fun!"
- Keep everything safe and appropriate for young children. If a topic is not suitable (romance, violence, scary or adult things), gently change to a fun, safe topic.
- Never ask for personal information like full name, school name, address, or phone number.
- No emojis, no lists, no markdown. Your reply will be read aloud.`;

const LEVELS = [10, 30, 50];           // 레벨업 지점 (50 이후 30개마다)
const LEARN_SESSIONS = 7;              // 이 횟수만큼은 기본 기준, 그 뒤로 평균 기준
const MIN_TURNS_TO_COUNT = 3;          // 아이가 3번 이상 말해야 '한 주제'로 인정
const DEFAULT_PRIZES = ["아이스크림 🍦", "주말 게임 30분 🎮", "원하는 선물 🎁"];

// ---------- 저장소 (실패해도 동작하도록) ----------
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  getJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } },
  setJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- 상태 ----------
let kid = null, kidId = null, topic = null, history = [], timeLeft = 0, timerId = null,
    timeUp = false, finished = false, busy = false, turns = 0, kidLines = [];

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

// ---------- 날짜 ----------
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayDiff(a, b) { return Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 86400000); }

// ---------- 기록 (보상) ----------
function loadStats(k) {
  return store.getJSON("stats_" + k, { sessions: [], words: [], days: [], streak: 0, lastDay: "", stickers: [] });
}
function saveStats(k, s) { store.setJSON("stats_" + k, s); }
function currentStreak(s) {
  if (!s.lastDay) return 0;
  return dayDiff(s.lastDay, today()) <= 1 ? s.streak : 0;
}
function levelFor(n) {
  // 지금까지 도달한 레벨 지점 목록
  const pts = [...LEVELS];
  while (pts[pts.length - 1] < n + 30) pts.push(pts[pts.length - 1] + 30);
  return pts;
}
function nextGoal(n) { return levelFor(n).find(p => p > n); }
function prizeFor(point) {
  const prizes = [1, 2, 3].map(i => store.get("prize" + i) || DEFAULT_PRIZES[i - 1]);
  const idx = LEVELS.indexOf(point);
  return idx >= 0 ? prizes[idx] : prizes[2];
}

// 노력 별 계산: 끝까지 하면 1개 + 노력 기준 3가지 중 맞춘 만큼 (최대 3개)
function wordsOf(t) { return (t.toLowerCase().match(/[a-z']+/g) || []); }
// 너무 기초적인 단어는 '새 단어'로 치지 않음 (4글자 이상 + 아래 목록 제외)
const BASIC = new Set(("like that this with have what yeah okay they them then there their about want very much good nice" +
  " know think play time from your will just when some really yes thank thanks fine sure because also make were been" +
  " would could should here where which these those going doing does didn't don't it's i'm that's").split(" "));
function scoreSession(k, s, lines) {
  const allWords = lines.flatMap(wordsOf);
  const turnsN = lines.length;
  const avgWords = turnsN ? allWords.length / turnsN : 0;
  const known = new Set(s.words);
  const fresh = [...new Set(allWords)].filter(w => w.length >= 4 && !BASIC.has(w) && !known.has(w));
  // 기준: 처음 LEARN_SESSIONS 번은 기본값, 그 뒤엔 최근 10회 평균 (기본값의 70% 아래로는 안 내려감)
  const b = KIDS[k].base;
  let need = { ...b };
  if (s.sessions.length >= LEARN_SESSIONS) {
    const recent = s.sessions.slice(-10);
    const avg = f => recent.reduce((a, x) => a + x[f], 0) / recent.length;
    need = {
      turns: Math.max(b.turns * 0.7, avg("turns")),
      words: Math.max(b.words * 0.7, avg("avgWords")),
      newWords: Math.max(b.newWords * 0.7, avg("newWords"))
    };
  }
  const hits = {
    talkedALot: turnsN >= need.turns,
    longSentences: avgWords >= need.words,
    newWords: fresh.length >= need.newWords
  };
  const stars = Math.min(3, 1 + Object.values(hits).filter(Boolean).length);
  return { stars, turns: turnsN, avgWords: +avgWords.toFixed(1), newWords: fresh.length, fresh, hits };
}

// ---------- 화면 이동 ----------
function refreshHome() {
  ["lucy", "leo"].forEach(k => {
    const s = loadStats(k), n = s.stickers.length, st = currentStreak(s);
    $(k === "lucy" ? "homeLucy" : "homeLeo").textContent = "⭐ " + n + (st ? "  🔥 " + st : "");
  });
}
document.querySelectorAll(".kid-btn").forEach(b => b.onclick = () => showTopics(b.dataset.kid));
$("backBtn").onclick = leaveChat;
$("topicBackBtn").onclick = () => { refreshHome(); show("home"); };
$("boardBtn").onclick = () => showBoard();
$("boardBackBtn").onclick = () => showTopics(kidId);
$("resBoardBtn").onclick = () => showBoard();
$("resDoneBtn").onclick = () => showTopics(kidId);

$("settingsBtn").onclick = () => {
  $("apiKey").value = store.get("geminiKey"); $("model").value = store.get("geminiModel");
  [1, 2, 3].forEach(i => $("prize" + i).value = store.get("prize" + i));
  $("testMode").checked = store.get("testMode") === "1";
  show("settings");
};
$("cancelSettings").onclick = () => show("home");
$("saveSettings").onclick = () => {
  store.set("geminiKey", $("apiKey").value.trim());
  store.set("geminiModel", $("model").value.trim());
  [1, 2, 3].forEach(i => store.set("prize" + i, $("prize" + i).value.trim()));
  store.set("testMode", $("testMode").checked ? "1" : "");
  refreshHome(); show("home");
};

// ---------- 주제 (한 번 고른 주제는 잠금, 다 쓰면 초기화) ----------
function usedTopics(k) { return store.getJSON("used_" + k, []); }
function markTopicUsed() {
  if (!topic || topic.id === "random") return;
  const all = KIDS[kidId].topics.map(t => t.id);
  let used = usedTopics(kidId).filter(id => all.includes(id));
  if (!used.includes(topic.id)) used.push(topic.id);
  if (used.length >= all.length) used = []; // 다 골랐으면 다시 처음부터
  store.setJSON("used_" + kidId, used);
}

function showTopics(k) {
  if (!store.get("geminiKey") || !store.get("geminiModel")) {
    alert("먼저 ⚙️ 설정에서 API 키와 모델 이름을 넣어 주세요.");
    return;
  }
  kidId = k; kid = KIDS[k];
  $("topicWho").textContent = kid.emoji + " " + kid.name;
  $("boardBtn").style.background = kid.soft;
  $("boardBtn").textContent = "⭐ " + loadStats(k).stickers.length;
  $("topicSub").textContent = "Pick one! Done topics come back after you finish them all.";
  const used = usedTopics(k);
  const grid = $("topicGrid"); grid.innerHTML = "";
  kid.topics.forEach(t => {
    const b = document.createElement("button");
    const isUsed = used.includes(t.id);
    b.className = "topic" + (isUsed ? " used" : "");
    b.disabled = isUsed;
    b.innerHTML = '<span class="ic">' + t.icon + "</span>" + t.title;
    b.onclick = () => startChat(t);
    grid.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "topic random"; r.style.background = kid.color;
  r.innerHTML = '<span class="ic">🎲</span>Random';
  r.onclick = () => startChat({ id: "random", icon: "🎲", title: "Random", hint: RANDOM_HINT });
  grid.appendChild(r);
  const done = used.filter(id => kid.topics.some(t => t.id === id)).length;
  $("topicProgress").textContent = done + " / " + kid.topics.length + " topics done";
  show("topics");
}

// ---------- 대화 ----------
function startChat(t) {
  topic = t; history = []; timeUp = false; finished = false; turns = 0; kidLines = [];
  $("messages").innerHTML = "";
  $("whoLabel").textContent = kid.emoji + " " + kid.name + " · " + t.icon + " " + t.title;
  $("micBtn").style.background = kid.color;
  $("timer").style.background = kid.soft;
  timeLeft = (store.get("testMode") === "1" ? 1 : kid.minutes) * 60; drawTimer();
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--; drawTimer();
    if (timeLeft <= 0) { clearInterval(timerId); timeUp = true; wrapUp(); }
  }, 1000);
  setInputs(true);
  show("chat");
  const opener = topic.id === "random"
    ? "(The conversation is starting. Greet " + kid.name + " warmly by name, then ask if there is something they want to talk about today.)"
    : "(The conversation is starting. Greet " + kid.name + " warmly by name, say today's topic is \"" + topic.title + "\", and ask one easy question about it.)";
  ask(opener, true);
}

function stopChat() {
  clearInterval(timerId);
  stopListening();
  try { speechSynthesis.cancel(); } catch (e) {}
}

function leaveChat() {
  if (!timeUp && turns > 0 &&
      !confirm("Leave now? Stars come when you finish the timer! ⭐\n(지금 나가면 별을 받을 수 없어요)")) return;
  stopChat();
  if (turns >= MIN_TURNS_TO_COUNT) markTopicUsed();
  showTopics(kidId);
}

function drawTimer() {
  const t = Math.max(0, timeLeft);
  $("timer").textContent = "⏱ " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  $("messages").appendChild(d);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function setStatus(t) { $("status").textContent = t; }
function setInputs(on) {
  $("micBtn").disabled = !on; $("sendBtn").disabled = !on; $("typeInput").disabled = !on;
}

// ---------- Gemini 호출 ----------
async function callGemini(system, contents, config) {
  const res = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(store.get("geminiModel")) + ":generateContent",
    {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": store.get("geminiKey") },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents, generationConfig: config })
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
  return (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
}

function chatSystem() {
  return kid.prompt + "\n\nToday's topic: " + topic.title + ". " + topic.hint +
    " Stay mostly on this topic, but it's okay to follow the child's interest if it is suitable." + COMMON_RULES;
}

async function ask(text, hidden) {
  if (busy || finished) return;
  busy = true; setInputs(false); setStatus("Thinking...");
  if (!hidden) { addMsg(text, "me"); turns++; kidLines.push(text); }
  history.push({ role: "user", parts: [{ text }] });
  try {
    const reply = await callGemini(chatSystem(), history, { temperature: 0.8, maxOutputTokens: 200 })
      || "Sorry, can you say that again?";
    history.push({ role: "model", parts: [{ text: reply }] });
    addMsg(reply, "ai");
    await speak(reply);
  } catch (err) {
    history.pop();
    addMsg("⚠️ 연결 오류: " + err.message, "note");
  }
  busy = false;
  if (timeUp) finishSession();
  else { setInputs(true); setStatus("Tap the mic and talk!"); }
}

function wrapUp() {
  stopListening();
  setInputs(false);
  const go = () => busy ? setTimeout(go, 500)
    : ask("(Time is up. Say a short, happy goodbye to " + kid.name + ", praise their effort, and say let's talk again tomorrow. Do not ask a question.)", true);
  go();
}

// ---------- 마무리: 보상 계산 + 결과 화면 ----------
function finishSession() {
  if (finished) return;
  finished = true;
  stopChat(); setInputs(false);
  markTopicUsed();

  const s = loadStats(kidId);
  const before = s.stickers.length;
  const sc = scoreSession(kidId, s, kidLines);
  const day = today();

  // 출석상: 오늘 첫 완료면 +1
  const firstToday = !s.days.includes(day);
  if (firstToday) {
    s.streak = (s.lastDay && dayDiff(s.lastDay, day) === 1) ? s.streak + 1 : 1;
    s.lastDay = day; s.days.push(day);
    s.stickers.push({ type: "att", day });
  }
  for (let i = 0; i < sc.stars; i++) s.stickers.push({ type: "star", day });
  s.sessions.push({ day, topic: topic.title, turns: sc.turns, avgWords: sc.avgWords, newWords: sc.newWords, stars: sc.stars });
  s.words = [...new Set([...s.words, ...sc.fresh])].slice(-3000);
  saveStats(kidId, s);

  // 레벨업 확인
  const after = s.stickers.length;
  const reached = levelFor(after).filter(p => p > before && p <= after);

  renderResult(sc, firstToday, s, reached);
  loadExpressions();
}

function renderResult(sc, firstToday, s, reached) {
  $("resEmoji").textContent = kid.emoji;
  $("resTitle").textContent = (sc.stars === 3 ? "Amazing, " : sc.stars === 2 ? "Great job, " : "Good try, ") + kid.name + "!";
  $("resStars").innerHTML = [0, 1, 2].map(i =>
    '<span class="' + (i < sc.stars ? "" : "off") + '" style="animation-delay:' + (0.2 + i * 0.35) + 's">⭐</span>').join("");
  $("resAttend").innerHTML = firstToday
    ? '<span class="badge">🗓 Attendance sticker +1 · 🔥 ' + s.streak + " day" + (s.streak > 1 ? "s" : "") + "</span>"
    : "";

  const good = [], next = [];
  (sc.hits.talkedALot ? good : next).push(sc.hits.talkedALot ? "You talked a lot! 🗣️" : "Next time, try to answer a few more times.");
  (sc.hits.longSentences ? good : next).push(sc.hits.longSentences ? "You made long sentences! 📏" : "Next time, try adding one more word to your sentences.");
  (sc.hits.newWords ? good : next).push(sc.hits.newWords ? "You used new words! 🆕" : "Next time, try a new word you know.");
  $("resCheer").innerHTML =
    "<h3>" + (sc.stars === 1 ? "You finished! That's great! 💪" : "What you did well") + "</h3>" +
    good.map(x => "<p>✅ " + x + "</p>").join("") +
    next.map(x => "<p>👉 " + x + "</p>").join("") +
    (sc.stars < 3 ? "<p style='color:var(--muted)'>You can do it next time! 화이팅! 🌈</p>" : "");

  if (reached.length) {
    const p = reached[reached.length - 1];
    $("resLevel").className = "card levelUp"; $("resLevel").style.display = "";
    $("resLevel").innerHTML = "<h3>🎉 LEVEL UP! " + p + " stickers!</h3><p>Show this to Mom or Dad!</p><p><b>🎁 " + escapeHtml(prizeFor(p)) + "</b></p>";
  } else {
    $("resLevel").style.display = "none";
  }
  $("resWords").innerHTML = "<li>Loading...</li>";
  show("result");
}

async function loadExpressions() {
  const transcript = history.filter(m => !m.parts[0].text.startsWith("(")).map(m =>
    (m.role === "user" ? kid.name : "Buddy") + ": " + m.parts[0].text).join("\n");
  const sys = "You help a Korean child review an English conversation. Reply ONLY with JSON: " +
    "{\"expressions\": [\"...\", \"...\", \"...\"]}. Give 3 short, useful English expressions (max 8 words each) " +
    "from or related to the conversation, easy enough for a " + (kidId === "leo" ? "3rd" : "5th") + " grader. " +
    "If the child made a mistake, you may include the correct form. No Korean.";
  try {
    const out = await callGemini(sys, [{ role: "user", parts: [{ text: transcript || "(short chat)" }] }],
      { temperature: 0.4, maxOutputTokens: 200, responseMimeType: "application/json" });
    const list = (JSON.parse(out.replace(/^```(json)?|```$/g, "")).expressions || []).slice(0, 3);
    if (!list.length) throw new Error("empty");
    $("resWords").innerHTML = list.map(x => "<li>" + escapeHtml(x) + "</li>").join("");
  } catch (e) {
    $("resWords").innerHTML = "<li>Great talking today!</li>";
  }
}

function escapeHtml(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------- 스티커판 ----------
function showBoard() {
  const s = loadStats(kidId), n = s.stickers.length, goal = nextGoal(n);
  const prevGoal = [0, ...levelFor(n)].filter(p => p <= n).pop() || 0;
  $("boardWho").textContent = kid.emoji + " " + kid.name + "'s Stickers";
  $("bTotal").textContent = n;
  $("bStreak").textContent = currentStreak(s);
  $("bDays").textContent = s.days.length;
  $("goalText").textContent = "Next prize: " + goal + " stickers";
  $("goalFill").style.background = kid.color;
  $("goalFill").style.width = Math.round((n - prevGoal) / (goal - prevGoal) * 100) + "%";
  $("goalSub").textContent = (goal - n) + " more to go! 🎁 " + prizeFor(goal);
  const g = $("stickerGrid"); g.innerHTML = "";
  const slots = Math.max(goal, Math.ceil(n / 5) * 5);
  for (let i = 0; i < slots; i++) {
    const d = document.createElement("div");
    const st = s.stickers[i];
    if (st) { d.className = "sticker" + (st.type === "att" ? " att" : ""); d.textContent = st.type === "att" ? "🗓" : kid.emoji; }
    else { d.className = "sticker empty"; d.textContent = i + 1; }
    g.appendChild(d);
  }
  show("board");
}

// ---------- 읽어 주기 (TTS) ----------
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
loadVoices();
try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}

function pickVoice() {
  const en = voices.filter(v => /^en(-|_)/i.test(v.lang));
  const female = /(samantha|karen|moira|tessa|victoria|zira|female|woman|aria|jenny|google us english)/i;
  return en.find(v => female.test(v.name) && /US/i.test(v.lang)) || en.find(v => female.test(v.name)) || en.find(v => /US/i.test(v.lang)) || en[0] || null;
}

function speak(text) {
  return new Promise(resolve => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice(); if (v) u.voice = v;
      u.lang = v ? v.lang : "en-US";
      u.rate = kid.rate; u.pitch = 1.1;
      u.onend = resolve; u.onerror = resolve;
      setTimeout(resolve, 20000); // 소리가 안 끝나도 멈추지 않게
      setStatus("🔊 Listening to " + kid.name + "'s buddy...");
      speechSynthesis.speak(u);
    } catch (e) { resolve(); }
  });
}

// ---------- 음성 인식 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

function stopListening() {
  if (rec && listening) { try { rec.stop(); } catch (e) {} }
  listening = false; $("micBtn").classList.remove("listening");
}

$("micBtn").onclick = () => {
  if (!SR) { alert("이 브라우저는 음성 인식을 지원하지 않습니다. 아이폰은 Safari, 안드로이드는 Chrome을 써 주세요. 아래 칸에 글자로 입력해도 됩니다."); return; }
  if (listening) { stopListening(); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const said = e.results[0][0].transcript.trim();
    stopListening();
    if (said) ask(said);
  };
  rec.onerror = e => {
    stopListening();
    setStatus(e.error === "not-allowed" ? "마이크 권한을 허용해 주세요." : "I didn't hear you. Try again!");
  };
  rec.onend = () => { if (listening) stopListening(); };
  listening = true; $("micBtn").classList.add("listening"); setStatus("I'm listening... 👂");
  try { rec.start(); } catch (e) { stopListening(); }
};

// ---------- 글자 입력 ----------
function sendTyped() {
  const t = $("typeInput").value.trim();
  if (!t || busy || timeUp) return;
  $("typeInput").value = ""; ask(t);
}
$("sendBtn").onclick = sendTyped;
$("typeInput").addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });

refreshHome();
</script>
